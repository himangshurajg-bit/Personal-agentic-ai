[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agentic-ai"
version = "0.1.0"
description = "A local-first bounded agent starter with explicit approvals"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/himangshurajg-bit/Personal-agentic-ai"
Repository = "https://github.com/himangshurajg-bit/Personal-agentic-ai"
Issues = "https://github.com/himangshurajg-bit/Personal-agentic-ai/issues"

[tool.setuptools]
packages = ["agent"]
include-package-data = false

[tool.setuptools.package-data]
agent = ["web_assets/index.html", "web_assets/style.css", "web_assets/app.js"]

[tool.ruff]
line-length = 110

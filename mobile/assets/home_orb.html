<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
:root {
  color-scheme: dark;
  --ink: #e5fff9;
  --muted: #9ab8b1;
  --core-rgb: 34, 203, 209;
  --core-bright: 205, 255, 251;
  --core-deep: 10, 83, 95;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  background: #06110f;
  color: var(--ink);
}
* { box-sizing: border-box; }
body {
  min-height: 100svh;
  margin: 0;
  padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(10, 100, 92, .24), transparent 54%),
    radial-gradient(ellipse at 80% 10%, rgba(37, 109, 103, .18), transparent 42%),
    #06110f;
}
.widget { width: min(100%, 760px); }
.widget-heading { padding: 0 8px; }
.eyebrow, .fallback-label { letter-spacing: .2em; font-size: .68rem; color: #83d8cf; }
h1 { margin: 9px 0 4px; font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 560; letter-spacing: -.04em; }
.note, .hint { color: var(--muted); line-height: 1.55; font-size: .9rem; }
.hero-art {
  position: relative;
  width: 100%;
  height: min(68svh, 560px);
  min-height: 330px;
  margin: 12px 0;
  overflow: hidden;
  isolation: isolate;
  perspective: 1100px;
  border: 1px solid rgba(117, 224, 212, .18);
  border-radius: 30px;
  background: radial-gradient(ellipse at 50% 53%, rgba(8, 45, 48, .72), rgba(5, 18, 17, .2) 62%, transparent 78%);
  box-shadow: inset 0 0 70px rgba(45, 206, 196, .05), 0 20px 80px rgba(0, 0, 0, .22);
}
.depth-scene { position: absolute; inset: 0; display: grid; place-items: center; }
.ai-core { position: relative; width: min(82%, 410px); aspect-ratio: 1; color: rgb(var(--core-rgb)); }
.core-aura { position: absolute; inset: 19%; border-radius: 50%; background: radial-gradient(circle, rgba(var(--core-bright), .18), rgba(var(--core-rgb), .07) 58%, transparent 72%); filter: blur(12px); }
.core-assembly { position: absolute; inset: 10%; transform-style: preserve-3d; animation: fallback-float 8s ease-in-out infinite; }
.core-shell { position: absolute; inset: 24%; overflow: hidden; border: 1px solid rgba(182, 255, 250, .7); border-radius: 50%; background: radial-gradient(circle at 34% 26%, rgba(230,255,252,.87), rgba(61,205,206,.29) 29%, rgba(10,77,88,.66) 78%); box-shadow: inset -15px -18px 32px rgba(1, 15, 25, .55), inset 8px 9px 20px rgba(238,255,255,.4), 0 0 36px rgba(36,229,224,.25); }
.core-grid { position: absolute; inset: 4%; border: 1px solid rgba(156,255,248,.32); border-radius: 50%; transform: rotateX(60deg) rotateZ(-20deg); }
.core-grid::before, .core-grid::after { content: ""; position: absolute; inset: -1px 25%; border: 1px solid rgba(156,255,248,.24); border-radius: 50%; }
.core-grid::after { transform: rotate(90deg); }
.core-light { position: absolute; width: 19%; aspect-ratio: 1; top: 40%; left: 40%; border-radius: 50%; background: radial-gradient(circle at 30% 28%, #efffff, #47f4e9 32%, #087c8a 82%); box-shadow: 0 0 28px rgba(61,246,235,.9), 0 0 70px rgba(24,195,199,.45); }
.core-scan, .core-reflection, .core-dial, .core-readout { display: none; }
.core-ring { position: absolute; left: 2%; top: 35%; width: 96%; height: 30%; border: 2px solid rgba(100,243,237,.86); border-radius: 50%; box-shadow: 0 0 13px rgba(50,228,221,.5); }
.ring-alpha { transform: rotateX(67deg) rotateZ(-24deg); }
.ring-beta { transform: rotateX(67deg) rotateZ(46deg); border-color: rgba(174,255,250,.74); }
.ring-gamma { transform: rotateY(68deg) rotateZ(13deg); border-color: rgba(47,187,197,.95); }
.core-satellite { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #83fff3; box-shadow: 0 0 15px #29dcd7; }
.satellite-one { left: 9%; top: 46%; }
.satellite-two { right: 12%; top: 26%; width: 8px; height: 8px; }
.core-equator { position: absolute; inset: 25%; border-top: 1px solid rgba(194,255,249,.46); border-radius: 50%; transform: rotateX(70deg); }
.hero-neural-stage { position: absolute; inset: 0 0 36px; z-index: 4; pointer-events: none; contain: layout paint; }
.hero-neural-canvas { display: block; width: 100%; height: 100%; pointer-events: none; }
.hero-art.hero-webgl .depth-scene, .hero-art.hero-webgl .fallback-label { visibility: hidden; }
.hero-art.hero-webgl .depth-scene * { animation: none !important; }
.hero-neural-caption { position: absolute; z-index: 5; left: 22px; bottom: 18px; color: rgba(173, 238, 231, .65); font-size: .61rem; letter-spacing: .18em; pointer-events: none; }
.glass-control, .hero-quality-control, .motion-toggle {
  color: #e6fffa;
  border: 1px solid rgba(124, 225, 214, .36);
  border-radius: 999px;
  background: rgba(6, 30, 29, .76);
  box-shadow: inset 0 1px rgba(255,255,255,.12), 0 6px 22px rgba(0,0,0,.23);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.hero-art .hero-signal-toggle { position: absolute; z-index: 6; right: 20px; top: 18px; padding: 10px 14px; cursor: pointer; pointer-events: auto; font: inherit; font-size: .78rem; }
.hero-quality-control { position: absolute; z-index: 6; right: 20px; top: 64px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; color: #b8d9d3; font-size: .75rem; }
.hero-quality-control select { max-width: 112px; color: #e6fffa; border: 0; background: transparent; font: inherit; }
.hero-quality-control option { color: #10211f; }
.motion-toggle { padding: 11px 16px; cursor: pointer; font: inherit; font-size: .84rem; }
.motion-toggle[aria-pressed="true"] { border-color: #78e4d6; }
button:focus-visible, select:focus-visible { outline: 3px solid #69eee0; outline-offset: 3px; }
.hint { margin: 11px 8px 0; font-size: .78rem; }
.fallback-label { position: absolute; z-index: 2; left: 22px; bottom: 19px; }
@keyframes fallback-float { 0%,100% { transform: rotateX(-8deg) rotateY(-10deg) translateY(-6px); } 50% { transform: rotateX(5deg) rotateY(12deg) translateY(7px); } }
@media (max-width: 520px) {
  body { padding-left: 12px; padding-right: 12px; }
  .hero-art { min-height: 300px; height: 56svh; border-radius: 23px; }
  .hero-art .hero-signal-toggle { right: 10px; top: 10px; padding: 8px 10px; }
  .hero-quality-control { right: 10px; top: 52px; padding: 7px 9px; }
  .hero-neural-caption, .fallback-label { left: 13px; bottom: 13px; font-size: .54rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}

html, body { width:100%; height:100%; min-height:0; margin:0; padding:0; overflow:hidden; background:transparent; }
body { display:block; }
.widget { width:100%; height:100%; }
.hero-art { width:100%; height:100%; min-height:0; margin:0; border:0; border-radius:0; box-shadow:none; }
.hero-art .hero-neural-stage { inset:0 0 32px; }
.hero-neural-caption, .fallback-label { left:14px; bottom:10px; font-size:.52rem; }
.hero-art .hero-signal-toggle { right:10px; top:9px; padding:7px 10px; font-size:.68rem; }
.hero-quality-control { right:10px; top:49px; padding:6px 8px; font-size:.66rem; }
.hero-quality-control select { max-width:85px; }
@media (prefers-reduced-motion: reduce) {
  .core-assembly { animation:none !important; }
  *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; }
}

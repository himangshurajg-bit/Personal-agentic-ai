name: Android16 phone preview qualification
on:
  workflow_dispatch:
  push:
    paths: ['mobile/**', 'ci/android16-checks.sh', '.github/workflows/android16.yml']
permissions:
  contents: read
jobs:
  android16:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install cargo-ndk and configure the Android NDK
        run: |
          cargo install cargo-ndk --locked
          ndk="${ANDROID_NDK_ROOT:-${ANDROID_NDK:-}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            ndk="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -n "$ndk" && test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ndk" >> "$GITHUB_ENV"
      - name: Rust native search checks
        run: |
          cargo fmt --manifest-path mobile/rust/local_search/Cargo.toml -- --check
          cargo test --manifest-path mobile/rust/local_search/Cargo.toml --locked
          cargo clippy --manifest-path mobile/rust/local_search/Cargo.toml --all-targets --locked -- -D warnings
      - name: Enable acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Flutter checks
        working-directory: mobile
        run: flutter pub get && flutter analyze && flutter test
      - name: API36 instrumented local-first checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ci/android16-checks.sh
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android16-preview-evidence
          path: evidence/

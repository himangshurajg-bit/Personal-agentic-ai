plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseStorePath = System.getenv('MYRA_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('MYRA_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('MYRA_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('MYRA_RELEASE_KEY_PASSWORD')
def releaseSigningConfigured = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isEmpty() }
def releaseStore = file(releaseStorePath ?: "${buildDir}/release-signing-not-configured.jks")

android {
    namespace 'com.myra.ultra.nativeapp'
    compileSdk 34
    defaultConfig {
        applicationId 'com.myra.ultra.nativeapp'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            storeFile releaseStore
            storePassword releaseStorePassword ?: ''
            keyAlias releaseKeyAlias ?: 'myra-ultra-release'
            keyPassword releaseKeyPassword ?: ''
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    // AndroidX Test's tracer calls forceEnableAppTracing; activity-compose otherwise resolves 1.0.0.
    implementation 'androidx.tracing:tracing:1.2.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'com.squareup.okio:okio:3.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation platform('androidx.compose:compose-bom:2024.06.00')
    androidTestImplementation platform('androidx.compose:compose-bom:2024.06.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}


tasks.configureEach { task ->
    if (task.name == 'validateSigningRelease') {
        task.doFirst {
            if (!releaseSigningConfigured) {
                throw new GradleException('Release signing is not configured; set the MYRA_RELEASE_* environment variables.')
            }
            if (!releaseStore.isFile()) {
                throw new GradleException('Release keystore file is missing.')
            }
        }
    }
}

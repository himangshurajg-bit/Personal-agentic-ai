name: Android API 36 smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api36:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reclaim unused runner disk for the emulator
        run: |
          echo 'Disk space before cleanup:'
          df -h /
          for path in \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/cmake \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/chrome \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL; do
            if [ -e "$path" ]; then sudo rm -rf "$path"; fi
          done
          sudo apt-get clean
          rm -rf "$HOME/.cache/pip" "$HOME/.cache/uv" "$HOME/.npm"
          echo 'Disk space after cleanup:'
          df -h /
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          pre-emulator-launch-script: cd native-android && ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          script: cd native-android && bash ../.github/scripts/run-api36-instrumentation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api36-instrumentation-results
          path: |
            native-android/app/build/reports/androidTests/connected/
            native-android/app/build/outputs/androidTest-results/connected/
            native-android/myra-api36-device-watch.log
            native-android/myra-api36-live-logcat.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: myra-native-android-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

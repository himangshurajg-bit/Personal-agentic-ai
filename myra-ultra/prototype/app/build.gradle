plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.myra.ultra'
    compileSdk 34

    defaultConfig {
        applicationId 'com.myra.ultra'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }

    sourceSets {
        main.python.srcDir 'src/main/python'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
    }
}
